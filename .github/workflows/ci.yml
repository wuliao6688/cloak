name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            go.sum
            cffi_dist/go.sum

      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Compile every root-module package without running network tests
        run: go test -run '^$' ./...

      - name: Compile bundled CFFI module against this checkout
        working-directory: cffi_dist
        run: go test -run '^$' ./...

      - name: Unit tests with race detector
        run: go test -race . ./profiles ./bandwidth ./cffi_src

      - name: Offline integration tests with race detector
        run: >-
          go test -race ./tests
          -run '^(TestConfigValidation_|TestRecorded|TestClient_UseSameConnection|TestClient_UseDifferentConnection|TestClient_UseCompressedResponse|TestClient_Redirect|TestClient_TestFailWithTimeout|TestWebSocketEcho$|TestWebSocketWithHeaderOrder|TestWebSocketWithoutHeaderOrder)'

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            go.sum
            cffi_dist/go.sum

      - name: Compile every root-module package
        run: go test -run '^$' ./...

      - name: Compile bundled CFFI module
        working-directory: cffi_dist
        run: go test -run '^$' ./...
